name: Deploy to S3

# Publishes the game to https://trippyhippies.org/trans-game/ with s3deploy
# (https://github.com/bep/s3deploy), run through the ksell8/s3-deploy action,
# authenticating to AWS through GitHub OIDC.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_ROLE_ARN                 IAM role GitHub assumes via OIDC
#   AWS_REGION                   region of the bucket
#   S3_BUCKET                    bucket to upload to
#   CLOUDFRONT_DISTRIBUTION_ID   distribution whose cache is invalidated after upload
# All four are required: the deploy job fails if any of them is not set.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE_PATH: trans-game/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir _site
          cp -R index.html index.js stylesheets imgs data sound _site/
          find _site -type f | sort

      - name: Report missing repository variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          for name in AWS_ROLE_ARN AWS_REGION S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning::Repository variable $name is not set; the deploy job will fail."
            else
              echo "$name is set"
            fi
          done

      # Installs s3deploy through the same action the deploy job uses, so pull
      # requests catch a broken action pin before it reaches main.
      - name: Check the s3-deploy action installs s3deploy
        id: s3deploy
        uses: ksell8/s3-deploy@v1
        with:
          install-only: true
      - run: s3deploy -V

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check repository variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          missing=0
          for name in AWS_ROLE_ARN AWS_REGION S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set (Settings > Secrets and variables > Actions > Variables)."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The s3deploy version comes from the action (its s3deploy-version/go.mod).
      - name: Deploy
        uses: ksell8/s3-deploy@v1
        env:
          S3DEPLOY_SOURCE: _site
          S3DEPLOY_BUCKET: ${{ vars.S3_BUCKET }}
          S3DEPLOY_REGION: ${{ vars.AWS_REGION }}
          S3DEPLOY_PATH: ${{ env.SITE_PATH }}
        with:
          args: -distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} -v

      # s3deploy invalidates the keys it uploaded, which may not cover the
      # directory URL (/trans-game/) or other cached copies. Invalidate the
      # whole site path so every deploy is visible right away.
      - name: Invalidate CloudFront cache for the site path
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/${SITE_PATH}*" \
            --query 'Invalidation.[Id,Status]' --output text
